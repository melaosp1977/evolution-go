name: Build fix-405

on:
  push:
    branches: [fix-405]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Atualizar whatsmeow para a versao mais recente
        run: |
          go get go.mau.fi/whatsmeow@main
          go mod tidy
          grep "go.mau.fi/whatsmeow " go.mod

      - name: Conferir compilacao do pacote alterado
        run: go vet ./pkg/whatsmeow/service/ || true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Montar e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=0.7.2-fix405
          tags: |
            ghcr.io/${{ github.repository_owner }}/evolution-go:fix-405
            ghcr.io/${{ github.repository_owner }}/evolution-go:fix-405-${{ github.run_number }}
